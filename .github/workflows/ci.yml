name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lowest Node the CLI claims to support, the current LTS, and the
          # version the release bundle is built with.
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          # M1 claims Windows acceptance, so the same suite has to pass there.
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # The release artifact is only useful if it builds and self-tests here too.
      - run: pnpm bundle

  installer-linux:
    name: installer (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n scripts/install.sh

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm bundle

      # Serve the artifact over real HTTP so the installer exercises its actual
      # download and checksum path, not a file:// shortcut.
      - name: Install from a locally served artifact
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory dist >/dev/null 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/apexnova.mjs.sha256 >/dev/null 2>&1 && break
            sleep 1
          done
          export APEXNOVA_ASSET_URL="http://127.0.0.1:8765/apexnova.mjs"
          export APEXNOVA_HOME="$RUNNER_TEMP/apexnova-home"
          export APEXNOVA_BIN="$RUNNER_TEMP/apexnova-bin"
          bash scripts/install.sh
          "$APEXNOVA_BIN/apexnova" --version

      # The v0.1.0 launcher recorded a bare `node`, which broke for anyone whose
      # Node had been installed by the installer itself.
      - name: Launcher works without node on PATH
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/barepath"
          ln -sf "$(command -v bash)" "$RUNNER_TEMP/barepath/bash"
          ln -sf "$(command -v env)" "$RUNNER_TEMP/barepath/env"
          if env -i PATH="$RUNNER_TEMP/barepath" bash -c 'command -v node'; then
            echo "expected node to be absent from the stripped PATH" >&2
            exit 1
          fi
          version="$(env -i PATH="$RUNNER_TEMP/barepath" HOME="$HOME" "$RUNNER_TEMP/apexnova-bin/apexnova" --version)"
          echo "$version"
          case "$version" in apexnova\ *) ;; *) echo "unexpected launcher output" >&2; exit 1 ;; esac

  installer-windows:
    name: installer (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell syntax
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./scripts/install.ps1).Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm bundle

      - name: Install from a locally served artifact
        run: |
          $dist = (Resolve-Path ./dist).Path
          $server = Start-Process -FilePath 'python' `
            -ArgumentList '-m', 'http.server', '8765', '--directory', $dist `
            -WorkingDirectory $dist -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                Invoke-WebRequest -Uri 'http://127.0.0.1:8765/apexnova.mjs.sha256' -UseBasicParsing | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'artifact server did not become ready' }

            $env:APEXNOVA_ASSET_URL = 'http://127.0.0.1:8765/apexnova.mjs'
            $env:APEXNOVA_HOME = Join-Path $env:RUNNER_TEMP 'apexnova-home'
            $env:APEXNOVA_BIN = Join-Path $env:RUNNER_TEMP 'apexnova-bin'
            # A separate process so the script's own exit code is what we assert on.
            & pwsh -NoProfile -File ./scripts/install.ps1
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      # install.ps1 used to swallow every failure and still exit 0 under `iex`.
      - name: Installer reports failure with a non-zero exit code
        run: |
          # Port 1 refuses the connection, so the failure needs no server.
          $env:APEXNOVA_ASSET_URL = 'http://127.0.0.1:1/apexnova.mjs'
          $env:APEXNOVA_HOME = Join-Path $env:RUNNER_TEMP 'apexnova-fail'
          $env:APEXNOVA_BIN = Join-Path $env:RUNNER_TEMP 'apexnova-fail-bin'
          & pwsh -NoProfile -File ./scripts/install.ps1
          if ($LASTEXITCODE -eq 0) { throw 'a failed install must not exit 0' }
          Write-Host "failed install exited $LASTEXITCODE as expected"

      - name: Launcher works without node on PATH
        run: |
          $launcher = Join-Path $env:RUNNER_TEMP 'apexnova-bin\apexnova.cmd'
          $saved = $env:PATH
          $env:PATH = "$env:SystemRoot;$env:SystemRoot\System32"
          try {
            if (Get-Command node -ErrorAction SilentlyContinue) {
              throw 'expected node to be absent from the stripped PATH'
            }
            $version = (& $launcher --version) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "launcher exited $LASTEXITCODE" }
            Write-Host $version
            if ($version -notmatch '^apexnova ') { throw "unexpected launcher output: $version" }
          } finally { $env:PATH = $saved }
